# 保留端口配置文件
# 用于端口冲突检测测试用例
# 所有端口冲突检测测试用例都从这个文件读取保留端口列表
#
# 修改历史:
# - 2025-12-05: 创建配置文件，统一管理保留端口列表
# - 2025-12-05: 7574 → 7547 (用户需求)
# - 2025-12-05: 移除22端口 (SSH端口不应限制用户配置)
#
# 保留端口说明:
# - 53: DNS
# - 1701: L2TP
# - 9001: 系统服务
# - 68: DHCP Client
# - 500: IKE (IPSec)
# - 4500: NAT-T (IPSec)
# - 123: NTP
# - 1: TCPMUX
# - 58: XNS Mail
# - 7547: CWMP (TR-069) ← 修改自7574
# - 9993: ZeroTier
# - 520: RIP

# 保留端口列表（12个）
reserved_ports:
  - 53
  - 1701
  - 9001
  - 68
  - 500
  - 4500
  - 123
  - 1
  - 58
  - 7547  # CWMP (TR-069) - 修改自7574
  - 9993
  - 520

# 已移除的端口（记录历史）
removed_ports:
  - 55832  # 2025-11-xx 移除
  - 40404  # 2025-11-xx 移除
  - 22     # 2025-12-05 移除 (SSH端口)
  - 7574   # 2025-12-05 改为7547
